name: CloudEventsIntegration

on:
  workflow_dispatch: {}
  pull_request:
    paths:
     - 'pkg/server/**'
     - 'pkg/work/spoke/*.go'
     - 'test/integration/work/**'
     - 'vendor/open-cluster-management.io/sdk-go/pkg/cloudevents/**'
     - 'vendor/open-cluster-management.io/sdk-go/pkg/server/grpc/**'
    branches:
      - main
      - release-*

env:
  GO_REQUIRED_MIN_VERSION: ''

permissions:
  contents: read

jobs:
  # Disable mqtt-work-integration: because the current source client does not support increasing resource generation.
  # mqtt-work-integration:
  #   name: mqtt-work-integration
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: checkout code
  #       uses: actions/checkout@v6.0.2
  #     - name: install Go
  #       uses: actions/setup-go@v6
  #       with:
  #         go-version-file: go.mod
  #     - name: integration
  #       run: make test-cloudevents-work-mqtt-integration

  grpc-work-integration:
    name: grpc-work-integration
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: integration
        run: make test-cloudevents-work-grpc-integration
